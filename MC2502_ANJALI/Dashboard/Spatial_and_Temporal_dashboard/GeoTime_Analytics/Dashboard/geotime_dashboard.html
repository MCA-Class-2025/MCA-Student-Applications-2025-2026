<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeoTime Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="dashboard_data.js" onerror="void 0"></script>
<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#0b1020;--cd:#131b33;--bd:#25305a;--tx:#e9edf8;--mu:#93a0c4;--a1:#ff7a45;--a2:#b05cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#2a1b5c55,transparent),var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
.w{max-width:1280px;margin:auto;padding:14px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 20px;border-radius:16px;background:linear-gradient(120deg,#ff7a45,#b05cff);box-shadow:0 8px 30px #b05cff33}
h1{margin:0;font-size:26px;color:#fff}header p{margin:2px 0 0;color:#ffffffd9;font-size:13px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}.ctl select,.btn{font:inherit;color:#fff;background:#0b102066;border:1px solid #ffffff55;border-radius:8px;padding:7px 12px;cursor:pointer}.ctl option{color:#111}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}nav button{font:inherit;color:var(--mu);background:var(--cd);border:1px solid var(--bd);border-radius:999px;padding:8px 16px;cursor:pointer}
nav button.on{color:#fff;background:linear-gradient(120deg,#ff7a45,#b05cff);border-color:transparent}
#ban{display:none;background:#fbbf2422;border:1px solid #fbbf24;color:#fde68a;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.k .c{border-top:3px solid var(--a1)}.k b{display:block;font-size:26px;margin-top:4px}.k span{color:var(--mu);font-size:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:0 2px 12px #0006;min-width:0}
.c h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between;align-items:center;gap:8px}
.c h3 button{font:inherit;font-size:11px;color:var(--tx);background:#0b1020;border:1px solid var(--bd);border-radius:6px;padding:2px 8px;cursor:pointer}
.h{position:relative;height:260px}.h canvas{width:100%;height:100%}.w2{grid-column:span 2}
@media(max-width:860px){.w2{grid-column:auto}}
.pg{display:none}.pg.on{display:block}ul{padding-left:18px;margin:0}li{margin:6px 0;line-height:1.45}
.n{color:var(--mu);font-size:12px;margin-top:8px;line-height:1.5}.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px;flex-wrap:wrap}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
#tip{position:fixed;pointer-events:none;background:#05081a;border:1px solid var(--a2);border-radius:8px;padding:6px 10px;font-size:12px;display:none;z-index:9;max-width:280px}
</style></head><body><div class="w">
<header><div><h1>GeoTime Analytics</h1><p>Spatial &amp; temporal exploration · USGS earthquake catalog</p></div>
<div class="ctl"><select id="yr"></select><select id="mg"></select><label class="btn">Load CSV<input id="fi" type="file" accept=".csv" hidden></label></div></header>
<nav id="nav"></nav><div id="ban"></div><div id="pgs"></div><div id="tip"></div></div>
<script>
const $=id=>document.getElementById(id),PAL=['#ff7a45','#b05cff','#38bdf8','#34d399','#fbbf24','#f472b6'],fmt=n=>Math.round(n).toLocaleString();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DC=d=>d<70?'#ff7a45':d<300?'#b05cff':'#38bdf8',DN=d=>d<70?'Shallow':d<300?'Intermediate':'Deep';
let D=[],F=[],page='ov',land=null,mode='pts',MP=[];const CH={};
Chart.defaults.color='#93a0c4';Chart.defaults.borderColor='#25305a';Chart.defaults.maintainAspectRatio=false;Chart.defaults.font.family='system-ui,sans-serif';
function mk(id,type,data,opt){CH[id]&&CH[id].destroy();CH[id]=new Chart($(id),{type,data,options:opt||{}})}
const card=(id,t,c,x)=>`<div class="c ${c||''}"><h3>${t}${x||''}</h3><div class="h"><canvas id="${id}"></canvas></div></div>`;
const kpi=(l,v)=>`<div class="c"><span>${l}</span><b>${v}</b></div>`,ax=(t,o)=>Object.assign({title:{display:!!t,text:t}},o||{});
const cnt=(a,f)=>{const o={};a.forEach(x=>{const k=f(x);o[k]=(o[k]||0)+1});return o};
const q=(a,p)=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(p*s.length))]};
const pear=(a,b)=>{const n=a.length,ma=a.reduce((s,x)=>s+x,0)/n,mb=b.reduce((s,x)=>s+x,0)/n;let c=0,va=0,vb=0;for(let i=0;i<n;i++){c+=(a[i]-ma)*(b[i]-mb);va+=(a[i]-ma)**2;vb+=(b[i]-mb)**2}return c/Math.sqrt(va*vb||1)};
/* ---- data ---- */
function csv(t){const R=[];let r=[],f='',o=false;for(let i=0;i<t.length;i++){const c=t[i];if(o){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else o=false}else f+=c}else if(c=='"')o=true;else if(c==',')r.push(f),f='';else if(c=='\n')r.push(f),R.push(r),r=[],f='';else if(c!='\r')f+=c}if(f||r.length){r.push(f);R.push(r)}return R}
function load(text){const R=csv(text),H=R.shift(),ix=Object.fromEntries(H.map((h,i)=>[h,i]));
D=R.filter(r=>r.length>5).map(r=>{const h=+r[ix.hour]||0,d=r[ix.depth]===''?NaN:+r[ix.depth];return{t:Date.parse(r[ix.EventDate])+h*36e5,la:+r[ix.latitude],lo:+r[ix.longitude],d,m:+r[ix.mag],p:r[ix.place]||'',ts:+r[ix.tsunami]||0,y:+r[ix.year],mo:+r[ix.month],h,wd:+r[ix.weekday_num],c:ix.spatial_cluster>=0?+r[ix.spatial_cluster]:-1}});init()}
function demo(){let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647,gs=()=>(rnd()+rnd()+rnd()-1.5)*1.6;
const Rg=[['Japan',142,38,4,30,5],['Indonesia',120,-3,4,60,5],['Chile',-72,-30,3,40,4],['Alaska',-150,60,3,30,4],['Tonga',-175,-20,3,200,4],['Mexico',-100,17,2,30,3],['Philippines',125,10,2,50,3],['Iran',55,30,1,15,3],['Peru',-76,-10,2,100,3],['New Zealand',175,-38,2,40,3],['Greece',23,38,1,10,3],['Mid-Atlantic Ridge',-30,0,1,10,5]];
const W=Rg.flatMap((r,i)=>Array(r[3]).fill(i)),t0=Date.UTC(2021,0,1),span=5*365;D=[];
for(let n=0;n<26000;n++){const i=W[Math.floor(rnd()*W.length)],g=Rg[i];let day=Math.floor(rnd()*span);
if(rnd()<.03)day=1200+Math.floor(rnd()*6);const h=Math.floor(rnd()*24),t=t0+day*864e5+h*36e5,dt=new Date(t);
D.push({t,la:Math.max(-85,Math.min(85,g[2]+gs()*g[5])),lo:g[1]+gs()*g[5]*1.3,d:Math.abs(g[4]*(.3+rnd()*1.4)),m:Math.min(8.4,2.5-Math.log10(rnd()||1e-4)*.95),p:'near '+g[0]+', '+g[0],ts:0,y:dt.getUTCFullYear(),mo:dt.getUTCMonth()+1,h,wd:(dt.getUTCDay()+6)%7+1,c:i})}
D.forEach(e=>e.ts=e.m>=6.5&&e.d<70&&rnd()<.5?1:0);
$('ban').style.display='block';$('ban').innerHTML='<b>Demo mode:</b> synthetic sample data, not real earthquakes. Run the pipeline (creates Dashboard/dashboard_data.js) or press <b>Load CSV</b> to use USGS data.';init()}
function init(){const ys=[...new Set(D.map(e=>e.y))].sort();$('yr').innerHTML='<option value="0">All years</option>'+ys.map(y=>`<option>${y}</option>`).join('');
$('mg').innerHTML=[[0,'All magnitudes'],[3,'M 3+'],[4,'M 4+'],[5,'M 5+'],[6,'M 6+']].map(a=>`<option value="${a[0]}">${a[1]}</option>`).join('');filt()}
function filt(){const y=+$('yr').value,m=+$('mg').value;F=D.filter(e=>(!y||e.y==y)&&e.m>=m);show(page)}
/* ---- map ---- */
function topo(t){const[sx,sy]=t.transform.scale,[tx,ty]=t.transform.translate;const A=t.arcs.map(a=>{let x=0,y=0;return a.map(p=>{x+=p[0];y+=p[1];return[x*sx+tx,y*sy+ty]})});
const ring=ids=>{let r=[];ids.forEach(i=>{const a=i<0?A[~i].slice().reverse():A[i];r.push(...(r.length?a.slice(1):a))});return r},o=[];
t.objects.countries.geometries.forEach(g=>(g.type=='Polygon'?[g.arcs]:g.type=='MultiPolygon'?g.arcs:[]).forEach(p=>p.forEach(r=>o.push(ring(r)))));return o}
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json()).then(t=>{land=topo(t);if(page=='sp')drawMap()}).catch(()=>{});
function drawMap(){const cv=$('map');if(!cv)return;const w=cv.parentNode.clientWidth,h=Math.round(w/2),d=devicePixelRatio||1;cv.width=w*d;cv.height=h*d;cv.parentNode.style.height=h+'px';
const x=cv.getContext('2d');x.scale(d,d);const X=l=>(l+180)/360*w,Y=l=>(90-l)/180*h;x.fillStyle='#0e1530';x.fillRect(0,0,w,h);
x.strokeStyle='#25305a55';for(let l=-180;l<=180;l+=30){x.beginPath();x.moveTo(X(l),0);x.lineTo(X(l),h);x.stroke()}for(let l=-90;l<=90;l+=30){x.beginPath();x.moveTo(0,Y(l));x.lineTo(w,Y(l));x.stroke()}
if(land){x.fillStyle='#1a2650';x.strokeStyle='#2e3d73';land.forEach(r=>{x.beginPath();r.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.closePath();x.fill();x.stroke()})}
MP=[];if(mode=='pts'){x.globalAlpha=.55;F.forEach(e=>{const r=.7+Math.max(0,e.m-2.5)*.9;x.fillStyle=isNaN(e.d)?'#888':DC(e.d);x.beginPath();x.arc(X(e.lo),Y(e.la),r,0,7);x.fill();MP.push([X(e.lo),Y(e.la),e])});x.globalAlpha=1}
else{const B=5,g={};let mx=1;F.forEach(e=>{const k=Math.floor((e.lo+180)/B)+','+Math.floor((e.la+90)/B);g[k]=(g[k]||0)+1;mx=Math.max(mx,g[k])});
Object.entries(g).forEach(([k,v])=>{const[i,j]=k.split(',').map(Number),a=Math.log(1+v)/Math.log(1+mx);x.fillStyle=`rgba(255,${Math.round(200-a*120)},${Math.round(70*(1-a))},${.2+a*.75})`;x.fillRect(X(i*B-180),Y((j+1)*B-90),w*B/360,h*B/180)})}}
$('pgs').addEventListener('mousemove',e=>{const cv=$('map'),t=$('tip');if(!cv||e.target!==cv||mode!='pts'){t.style.display='none';return}const b=cv.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;let best=null,bd=64;
for(const p of MP){const dd=(p[0]-mx)**2+(p[1]-my)**2;if(dd<bd&&(!best||p[2].m>best[2].m||dd<bd*.5)){bd=dd;best=p}}
if(!best){t.style.display='none';return}const v=best[2];t.innerHTML=`<b>M ${v.m.toFixed(1)}</b> · ${isNaN(v.d)?'?':v.d.toFixed(0)} km (${isNaN(v.d)?'?':DN(v.d)})<br>${v.p}<br>${new Date(v.t).toISOString().slice(0,10)}`;t.style.display='block';t.style.left=e.clientX+12+'px';t.style.top=e.clientY+12+'px'});
/* ---- heatmap canvas ---- */
function heat(id,M,rl,cl,fn,txt){const cv=$(id),w=cv.parentNode.clientWidth,h=cv.parentNode.clientHeight,d=devicePixelRatio||1;cv.width=w*d;cv.height=h*d;const x=cv.getContext('2d');x.scale(d,d);
const L=40,T=18,cw=(w-L)/cl.length,ch=(h-T)/rl.length;x.font='11px system-ui';x.textAlign='center';
cl.forEach((c,j)=>{if(cl.length<13||j%2==0){x.fillStyle='#93a0c4';x.fillText(c,L+j*cw+cw/2,12)}});
rl.forEach((r,i)=>{x.textAlign='right';x.fillStyle='#93a0c4';x.fillText(r,L-5,T+i*ch+ch/2+4);cl.forEach((c,j)=>{x.fillStyle=fn(M[i][j]);x.fillRect(L+j*cw+1,T+i*ch+1,cw-2,ch-2);if(txt){x.textAlign='center';x.fillStyle='#fff';x.fillText(M[i][j].toFixed(2),L+j*cw+cw/2,T+i*ch+ch/2+4)}})})}
/* ---- pages ---- */
const P={
ov:{n:'Global Overview',h:()=>`<div class="k" id="kp"></div><div class="g">${card('a1','Magnitude distribution (histogram)')}${card('a2','Magnitude class (doughnut)')}${card('a3','Depth class (polar area)')}${card('a4','Top 10 regions (bar)')}${card('a5','Events per year (column)')}
<div class="c"><h3>Quick insights</h3><ul id="ins"></ul></div></div>`,
r(){const n=F.length||1,mg=F.map(e=>e.m),ds=F.map(e=>e.d).filter(x=>!isNaN(x));
$('kp').innerHTML=kpi('Events',fmt(F.length))+kpi('Mean magnitude',(mg.reduce((a,b)=>a+b,0)/n).toFixed(2))+kpi('Max magnitude',F.length?Math.max(...mg).toFixed(1):'–')+kpi('M 5+',fmt(F.filter(e=>e.m>=5).length))+kpi('Mean depth',ds.length?fmt(ds.reduce((a,b)=>a+b,0)/ds.length)+' km':'–')+kpi('Tsunami-flagged',(F.filter(e=>e.ts).length/n*100).toFixed(1)+'%');
const b=cnt(F,e=>(Math.floor(e.m*2)/2).toFixed(1)),bk=Object.keys(b).sort((a,c)=>a-c);
mk('a1','bar',{labels:bk,datasets:[{data:bk.map(k=>b[k]),backgroundColor:'#ff7a45'}]},{plugins:{legend:{display:false}},scales:{x:ax('Magnitude (0.5 bins)'),y:ax('Events',{type:'logarithmic'})}});
const mc=cnt(F,e=>e.m<4?'M<4':e.m<5?'M4–4.9':e.m<6?'M5–5.9':e.m<7?'M6–6.9':'M7+');const ml=Object.keys(mc);
mk('a2','doughnut',{labels:ml,datasets:[{data:ml.map(k=>mc[k]),backgroundColor:PAL,borderColor:'#131b33'}]},{cutout:'58%',plugins:{legend:{position:'right'}}});
const dc=cnt(F.filter(e=>!isNaN(e.d)),e=>DN(e.d)),dl=['Shallow','Intermediate','Deep'];
mk('a3','polarArea',{labels:dl,datasets:[{data:dl.map(k=>dc[k]||0),backgroundColor:['#ff7a45cc','#b05cffcc','#38bdf8cc']}]},{plugins:{legend:{position:'right'}},scales:{r:{ticks:{display:false}}}});
const rg=cnt(F,e=>(e.p.split(', ').pop()||'?').trim()),top=Object.entries(rg).sort((a,c)=>c[1]-a[1]).slice(0,10);
mk('a4','bar',{labels:top.map(t=>t[0]),datasets:[{data:top.map(t=>t[1]),backgroundColor:'#b05cff'}]},{indexAxis:'y',plugins:{legend:{display:false}}});
const yc=cnt(F,e=>e.y),yl=Object.keys(yc).sort();
mk('a5','bar',{labels:yl,datasets:[{data:yl.map(k=>yc[k]),backgroundColor:'#38bdf8'}]},{plugins:{legend:{display:false}}});
$('ins').innerHTML=top.length?`<li>Most active region: <b>${top[0][0]}</b> (${fmt(top[0][1])} events, ${(top[0][1]/n*100).toFixed(1)}%).</li><li>${(dc.Shallow/(ds.length||1)*100||0).toFixed(0)}% of events are shallow (&lt;70 km).</li><li>Small events dominate: ${(F.filter(e=>e.m<4).length/n*100).toFixed(0)}% are below M4, as expected from the Gutenberg–Richter law.</li><li>Busiest year: <b>${yl.reduce((a,c)=>yc[c]>yc[a]?c:a)}</b>.</li>`:'<li>No events for this filter.</li>'}},
tm:{n:'Temporal Intelligence',h:()=>`<div class="g">${card('t1','Monthly events (line) and M5+ events (line, right axis)','w2')}${card('t2','Cumulative events (area)')}${card('t3','Seasonality by month (radar)')}
<div class="c"><h3>Hour of day × weekday, UTC (heatmap)</h3><div class="h"><canvas id="t4"></canvas></div></div>${card('t5','Events by weekday (bar)')}
${card('t6','Daily events with 30-day mean and +3 SD anomaly threshold','w2')}</div>`,
r(){const ms={};F.forEach(e=>{const k=e.y*12+e.mo-1;ms[k]=ms[k]||[0,0];ms[k][0]++;if(e.m>=5)ms[k][1]++});const ks=Object.keys(ms).map(Number).sort((a,b)=>a-b),lb=ks.map(k=>Math.floor(k/12)+'-'+String(k%12+1).padStart(2,'0'));
mk('t1','line',{labels:lb,datasets:[{label:'All events',data:ks.map(k=>ms[k][0]),borderColor:'#ff7a45',backgroundColor:'#ff7a45',tension:.25,pointRadius:2,yAxisID:'y'},{label:'M5+',data:ks.map(k=>ms[k][1]),borderColor:'#38bdf8',backgroundColor:'#38bdf8',tension:.25,pointRadius:2,yAxisID:'y1'}]},{scales:{y:ax('Events'),y1:ax('M5+',{position:'right',grid:{drawOnChartArea:false}}),x:{ticks:{maxTicksLimit:14}}}});
let c=0;mk('t2','line',{labels:lb,datasets:[{label:'Cumulative',data:ks.map(k=>c+=ms[k][0]),fill:true,borderColor:'#b05cff',backgroundColor:'#b05cff44',pointRadius:0,tension:.2}]},{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:8}}}});
const mm=cnt(F,e=>e.mo);mk('t3','radar',{labels:MON,datasets:[{label:'Events',data:MON.map((_,i)=>mm[i+1]||0),borderColor:'#34d399',backgroundColor:'#34d39944'}]},{plugins:{legend:{display:false}},scales:{r:{ticks:{display:false},grid:{color:'#25305a'},angleLines:{color:'#25305a'}}}});
const M=DAY.map(()=>Array(24).fill(0));F.forEach(e=>{if(e.wd>=1&&e.wd<=7)M[e.wd-1][e.h]++});const mx=Math.max(1,...M.flat());
heat('t4',M,DAY,[...Array(24).keys()].map(String),v=>`rgba(255,122,69,${(.08+v/mx*.9).toFixed(2)})`);
const wk=cnt(F,e=>e.wd);mk('t5','bar',{labels:DAY,datasets:[{data:DAY.map((_,i)=>wk[i+1]||0),backgroundColor:DAY.map((_,i)=>i>4?'#f472b6':'#fbbf24')}]},{plugins:{legend:{display:false}}});
const dc={};F.forEach(e=>{const k=Math.floor(e.t/864e5);dc[k]=(dc[k]||0)+1});const dk=Object.keys(dc).map(Number),a=Math.min(...dk),b=Math.max(...dk),N=isFinite(a)?b-a+1:0,v=Array.from({length:N},(_,i)=>dc[a+i]||0),mean=[],thr=[],an=[];
for(let i=0;i<N;i++){if(i<29){mean.push(null);thr.push(null);an.push(null);continue}let s=0,s2=0;for(let j=i-29;j<=i;j++){s+=v[j];s2+=v[j]*v[j]}const m=s/30,sd=Math.sqrt(Math.max(0,(s2-30*m*m)/29));mean.push(m);thr.push(m+3*sd);an.push(v[i]>m+3*sd?v[i]:null)}
const dl=v.map((_,i)=>new Date((a+i)*864e5).toISOString().slice(0,10));
mk('t6','line',{labels:dl,datasets:[{label:'Daily',data:v,borderColor:'#93a0c466',pointRadius:0,borderWidth:1},{label:'30-day mean',data:mean,borderColor:'#34d399',pointRadius:0,borderWidth:2},{label:'+3 SD',data:thr,borderColor:'#fbbf24',borderDash:[5,4],pointRadius:0,borderWidth:1.5},{label:'Anomaly',data:an,showLine:false,pointRadius:4,backgroundColor:'#ff5470',borderColor:'#ff5470'}]},{scales:{x:{ticks:{maxTicksLimit:10}}}})}},
sp:{n:'Spatial Intelligence',h:()=>`<div class="g"><div class="c w2"><h3>Epicentres on the world map<span><button onclick="mode='pts';drawMap()">Points</button> <button onclick="mode='den';drawMap()">Density grid</button></span></h3><div class="h"><canvas id="map"></canvas></div>
<div class="lg"><span><i style="background:#ff7a45"></i>Shallow &lt;70 km</span><span><i style="background:#b05cff"></i>Intermediate 70–300</span><span><i style="background:#38bdf8"></i>Deep &gt;300</span><span>Dot size = magnitude</span></div></div>
${card('s1','Events by latitude band (bar)')}${card('s2','Depth vs magnitude (scatter, sample)')}${card('s3','Largest spatial clusters, DBSCAN (bubble)')}${card('s4','Events by longitude band (area line)')}</div>`,
r(){drawMap();const lb=cnt(F,e=>Math.floor(e.la/15)*15),ls=[];for(let l=-90;l<90;l+=15)ls.push(l);
mk('s1','bar',{labels:ls.map(l=>l+'°'),datasets:[{data:ls.map(l=>lb[l]||0),backgroundColor:'#ff7a45'}]},{plugins:{legend:{display:false}},scales:{x:ax('Latitude band start')}});
const st=Math.max(1,Math.ceil(F.length/2500)),sm=F.filter((e,i)=>i%st==0&&!isNaN(e.d));
mk('s2','scatter',{datasets:[{data:sm.map(e=>({x:e.m,y:e.d})),pointRadius:2,backgroundColor:sm.map(e=>DC(e.d)+'99')}]},{plugins:{legend:{display:false}},scales:{x:ax('Magnitude'),y:ax('Depth (km)',{reverse:true})}});
const cl={};F.forEach(e=>{if(e.c>=0){const o=cl[e.c]=cl[e.c]||{n:0,x:0,y:0};o.n++;o.x+=e.lo;o.y+=e.la}});const tc=Object.values(cl).sort((a,b)=>b.n-a.n).slice(0,12);const mxn=tc[0]?tc[0].n:1;
mk('s3','bubble',{datasets:[{label:'Cluster',data:tc.map(o=>({x:o.x/o.n,y:o.y/o.n,r:4+Math.sqrt(o.n/mxn)*20,n:o.n})),backgroundColor:'#b05cff88',borderColor:'#b05cff'}]},{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw.n)+' events'}}},scales:{x:ax('Longitude',{min:-180,max:180}),y:ax('Latitude',{min:-90,max:90})}});
const lo=cnt(F,e=>Math.floor(e.lo/20)*20),os=[];for(let l=-180;l<180;l+=20)os.push(l);
mk('s4','line',{labels:os.map(l=>l+'°'),datasets:[{data:os.map(l=>lo[l]||0),fill:true,borderColor:'#38bdf8',backgroundColor:'#38bdf833',tension:.3,pointRadius:2}]},{plugins:{legend:{display:false}},scales:{x:ax('Longitude band start')}})}},
ad:{n:'Advanced Analytics',h:()=>`<div class="g">${card('d1','Gutenberg–Richter: log10 N(≥M) vs M (scatter + fit)')}${card('d2','Correlation matrix (heatmap)')}${card('d3','Depth spread by magnitude class, Q1–Q3 with median (floating bar)')}${card('d4','Tsunami-flag rate by magnitude class (bar)')}
${card('d5','M5+ events through time (scatter)','w2')}<div class="c w2"><h3>Reading the charts</h3><ul id="adi"></ul></div></div>`,
r(){const pts=[];for(let m=2.5;m<=7.5;m+=.1){const n=F.filter(e=>e.m>=m).length;if(n>0)pts.push({x:+m.toFixed(1),y:Math.log10(n),n})}
const fp=pts.filter(p=>p.x>=3&&p.n>=5);let b=NaN,a=NaN;if(fp.length>2){const mx=fp.reduce((s,p)=>s+p.x,0)/fp.length,my=fp.reduce((s,p)=>s+p.y,0)/fp.length;let nu=0,de=0;fp.forEach(p=>{nu+=(p.x-mx)*(p.y-my);de+=(p.x-mx)**2});const sl=nu/de;b=-sl;a=my-sl*mx}
mk('d1','scatter',{datasets:[{label:'log10 N',data:pts,backgroundColor:'#ff7a45'},{label:'Fit',type:'line',data:fp.length>2?[{x:fp[0].x,y:a-b*fp[0].x},{x:fp[fp.length-1].x,y:a-b*fp[fp.length-1].x}]:[],borderColor:'#34d399',pointRadius:0,borderWidth:2}]},{scales:{x:ax('Magnitude'),y:ax('log10 events ≥ M')}});
const V=[['Mag',e=>e.m],['Depth',e=>e.d],['Hour',e=>e.h],['Month',e=>e.mo],['Lat',e=>e.la],['Lon',e=>e.lo]],G=F.filter(e=>!isNaN(e.d)),CM=V.map(r=>V.map(c=>G.length>2?pear(G.map(r[1]),G.map(c[1])):0));
heat('d2',CM,V.map(v=>v[0]),V.map(v=>v[0]),v=>v>=0?`rgba(255,122,69,${(.1+v*.9).toFixed(2)})`:`rgba(56,189,248,${(.1-v*.9).toFixed(2)})`,true);
const C=['M<4','M4–4.9','M5–5.9','M6+'],fc=e=>e.m<4?0:e.m<5?1:e.m<6?2:3,bx=C.map((_,i)=>G.filter(e=>fc(e)==i).map(e=>e.d));
mk('d3','bar',{labels:C,datasets:[{label:'Q1–Q3 depth (km)',data:bx.map(a=>[q(a,.25),q(a,.75)]),backgroundColor:'#b05cff99'},{label:'Median',type:'line',data:bx.map(a=>q(a,.5)),borderColor:'#fbbf24',backgroundColor:'#fbbf24',showLine:false,pointRadius:6}]},{scales:{y:ax('Depth (km)',{reverse:true})}});
mk('d4','bar',{labels:C,datasets:[{data:C.map((_,i)=>{const g=F.filter(e=>fc(e)==i);return g.length?g.filter(e=>e.ts).length/g.length*100:0}),backgroundColor:'#38bdf8'}]},{plugins:{legend:{display:false}},scales:{y:ax('% flagged')}});
const bg=F.filter(e=>e.m>=5);mk('d5','scatter',{datasets:[{data:bg.map(e=>({x:e.t,y:e.m})),backgroundColor:bg.map(e=>DC(e.d)+'aa'),pointRadius:bg.map(e=>2+(e.m-5)*2)}]},{plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>new Date(c.raw.x).toISOString().slice(0,10)+' · M'+c.raw.y.toFixed(1)}}},scales:{x:{type:'linear',ticks:{callback:v=>new Date(v).getUTCFullYear()}},y:ax('Magnitude')}});
const r=G.length>2?pear(G.map(e=>e.m),G.map(e=>e.d)):0;
$('adi').innerHTML=`<li>Gutenberg–Richter b-value (M≥3 fit): <b>${isNaN(b)?'n/a':b.toFixed(2)}</b>. Values near 1 are typical for global catalogs.</li><li>Magnitude–depth Pearson r = <b>${r.toFixed(2)}</b>; weak values mean depth is not a strong linear driver of magnitude.</li><li>Red anomaly dots on the Temporal page mark days above the 30-day mean + 3 SD, usually aftershock sequences.</li>`}}};
$('nav').innerHTML=Object.entries(P).map(([k,v])=>`<button data-k="${k}">${v.n}</button>`).join('');
$('pgs').innerHTML=Object.entries(P).map(([k,v])=>`<section class="pg" id="p_${k}">${v.h()}</section>`).join('');
function show(k){page=k;document.querySelectorAll('.pg').forEach(p=>p.classList.toggle('on',p.id=='p_'+k));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));P[k].r()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.k));
$('yr').onchange=$('mg').onchange=filt;addEventListener('resize',()=>{if(F.length)show(page)});
$('fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('ban').style.display='none';load(r.result)};r.readAsText(f)};
if(window.GEO_CSV)load(window.GEO_CSV);else demo();
