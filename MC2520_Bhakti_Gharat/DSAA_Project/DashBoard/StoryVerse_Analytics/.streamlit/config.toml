# Theme settings only (no custom HTML/CSS/JS). Streamlit applies these colours natively.
[theme]
base = "light"
primaryColor = "#7C3AED"
backgroundColor = "#EEF2FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#14213D"
font = "sans serif"
baseRadius = "large"
borderColor = "#DDE3F0"

# Dark navy sidebar like a business-analytics product
[theme.sidebar]
backgroundColor = "#1B2845"
secondaryBackgroundColor = "#2A3A63"
textColor = "#E8ECF6"
primaryColor = "#A78BFA"
borderColor = "#34456F"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false
