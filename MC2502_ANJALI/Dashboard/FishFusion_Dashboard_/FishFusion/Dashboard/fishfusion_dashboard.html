<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FishFusion Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#0b1020;--cd:#131b33;--bd:#25305a;--tx:#e9edf8;--mu:#93a0c4;--a1:#ff7a45;--a2:#b05cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#2a1b5c55,transparent),var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
.w{max-width:1280px;margin:auto;padding:14px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 20px;border-radius:16px;background:linear-gradient(120deg,#ff7a45,#b05cff);box-shadow:0 8px 30px #b05cff33}
h1{margin:0;font-size:26px;color:#fff}header p{margin:2px 0 0;color:#ffffffd9;font-size:13px}
header select{font:inherit;color:#fff;background:#0b102066;border:1px solid #ffffff55;border-radius:8px;padding:7px 12px}header option{color:#111}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}nav button{font:inherit;color:var(--mu);background:var(--cd);border:1px solid var(--bd);border-radius:999px;padding:8px 16px;cursor:pointer}
nav button.on{color:#fff;background:linear-gradient(120deg,#ff7a45,#b05cff);border-color:transparent}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:12px}
.k .c{border-top:3px solid var(--a1)}.k b{display:block;font-size:26px;margin-top:4px}.k span{color:var(--mu);font-size:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;box-shadow:0 2px 12px #0006;min-width:0}
.c h3{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
.h{position:relative;height:260px}.h canvas{width:100%;height:100%}.w2{grid-column:span 2}
@media(max-width:860px){.w2{grid-column:auto}}
.pg{display:none}.pg.on{display:block}ul{padding-left:18px;margin:0}li{margin:6px 0;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600}
tr.r{cursor:pointer}tr.r:hover,tr.sel{background:#b05cff22}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.n{color:var(--mu);font-size:12px;margin-top:10px;line-height:1.5}
.tw{overflow-x:auto}
#tip{position:fixed;pointer-events:none;background:#05081a;border:1px solid var(--a2);border-radius:8px;padding:6px 10px;font-size:12px;display:none;z-index:9;max-width:280px}
</style></head><body><div class="w">
<header><div><h1>FishFusion Analytics</h1><p>Fish images fused with GBIF occurrences · USDA nutrition · live weather</p></div>
<select id="foc" title="Focus a species"></select></header>
<nav id="nav"></nav><div id="pgs"></div><div id="tip"></div></div>
<script>
const S=[{"name": "Type 1 Pomfret", "n": 1579, "train": 1264, "test": 315, "can": "Pampus argenteus", "tk": 2397682, "cty": "KR", "lat": 30.28195434, "lon": 114.42000655, "occ": 500, "countries": 15, "fdc": 174195, "fdesc": "Fish, fish sticks, frozen, prepared", "cal": 277.0, "pro": 11.0, "fat": 16.2, "car": 21.7, "wdesc": "overcast clouds", "loc": "Wulijie, CN", "temp": 23.67, "hum": 93.0, "prs": 1002.0, "wnd": 3.82, "cld": 94.0}, {"name": "Type 3 Black Snapper", "n": 1328, "train": 1063, "test": 265, "can": "Apsilus dentatus", "tk": 5209891, "cty": "CO", "lat": 17.93649433898305, "lon": -78.87354672881357, "occ": 59, "countries": 15, "fdc": 2706283, "fdesc": "Fish, snapper", "cal": 185.0, "pro": 22.78, "fat": 6.26, "car": 7.79, "wdesc": "clear sky", "loc": "Negril, JM", "temp": 29.37, "hum": 74.0, "prs": 1014.0, "wnd": 6.86, "cld": 7.0}, {"name": "Type 4 Indian Carp", "n": 974, "train": 780, "test": 194, "can": "Labeo rohita", "tk": 5206083, "cty": "IN", "lat": 19.49565742, "lon": 92.49297668, "occ": 466, "countries": 11, "fdc": 2706233, "fdesc": "Fish, carp", "cal": 213.0, "pro": 19.97, "fat": 10.72, "car": 7.79, "wdesc": "overcast clouds", "loc": "Myoma, MM", "temp": 27.16, "hum": 88.0, "prs": 1005.0, "wnd": 4.89, "cld": 100.0}, {"name": "Type 5 Prawn", "n": 1136, "train": 909, "test": 227, "can": "Penaeus indicus", "tk": 2223719, "cty": "MZ", "lat": -4.03596463, "lon": 57.82556855, "occ": 4909, "countries": 15, "fdc": 2706449, "fdesc": "Shrimp cocktail", "cal": 99.0, "pro": 13.24, "fat": 1.22, "car": 7.92, "wdesc": "light rain", "loc": "Unknown", "temp": 26.92, "hum": 83.0, "prs": 1014.0, "wnd": 4.55, "cld": 100.0}, {"name": "Type 6 Pink Perch", "n": 519, "train": 416, "test": 103, "can": "Zalembius rosaceus", "tk": 2389229, "cty": "US", "lat": 36.00323442, "lon": -121.12834448, "occ": 158881, "countries": 3, "fdc": 175125, "fdesc": "Fish, ocean perch, Atlantic, raw", "cal": 79.0, "pro": 15.3, "fat": 1.54, "car": 0.0, "wdesc": "few clouds", "loc": "King City, US", "temp": 19.82, "hum": 70.0, "prs": 1013.0, "wnd": 2.27, "cld": 11.0}, {"name": "Type 8 Black Pomfret", "n": 1471, "train": 1177, "test": 294, "can": "Parastromateus niger", "tk": 2391217, "cty": "AU", "lat": 4.57296819, "lon": 106.6050858, "occ": 6398, "countries": 15, "fdc": 174188, "fdesc": "Fish, caviar, black and red, granular", "cal": 264.0, "pro": 24.6, "fat": 17.9, "car": 4.0, "wdesc": "scattered clouds", "loc": "Unknown", "temp": 28.9, "hum": 73.0, "prs": 1010.0, "wnd": 6.25, "cld": 42.0}];const Q={"total": 7007, "gbif": 7007, "usda": 7007, "wx": 7007, "unk": 2607, "nulls": 0, "ok": 7007};
const $=id=>document.getElementById(id),PAL=['#ff7a45','#b05cff','#38bdf8','#34d399','#fbbf24','#f472b6'];
const sh=s=>s.name.replace(/^Type \d+ /,''),sum=(a,f)=>a.reduce((t,x)=>t+f(x),0),fmt=n=>n.toLocaleString();
let foc=-1,page='ov',land=null;const CH={};
const col=i=>foc<0||foc==i?PAL[i]:PAL[i]+'44';
Chart.defaults.color='#93a0c4';Chart.defaults.borderColor='#25305a';Chart.defaults.maintainAspectRatio=false;Chart.defaults.font.family='system-ui,sans-serif';
function mk(id,type,data,opt){CH[id]&&CH[id].destroy();CH[id]=new Chart($(id),{type,data,options:opt||{}})}
const card=(id,t,c)=>`<div class="c ${c||''}"><h3>${t}</h3><div class="h"><canvas id="${id}"></canvas></div></div>`;
const kpi=(l,v)=>`<div class="c"><span>${l}</span><b>${v}</b></div>`;
const ax=(t,o)=>Object.assign({title:{display:!!t,text:t}},o||{});
/* ---- map (equirectangular canvas) ---- */
function topo(t){const[sx,sy]=t.transform.scale,[tx,ty]=t.transform.translate;
const A=t.arcs.map(a=>{let x=0,y=0;return a.map(p=>{x+=p[0];y+=p[1];return[x*sx+tx,y*sy+ty]})});
const ring=ids=>{let r=[];ids.forEach(i=>{const a=i<0?A[~i].slice().reverse():A[i];r.push(...(r.length?a.slice(1):a))});return r},out=[];
t.objects.countries.geometries.forEach(g=>{(g.type=='Polygon'?[g.arcs]:g.type=='MultiPolygon'?g.arcs:[]).forEach(p=>p.forEach(r=>out.push(ring(r))))});return out}
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json()).then(t=>{land=topo(t);if(page=='sp')drawMap()}).catch(()=>{});
let MP=[];
function drawMap(){const cv=$('map');if(!cv)return;const w=cv.parentNode.clientWidth,h=Math.round(w/2),d=devicePixelRatio||1;
cv.width=w*d;cv.height=h*d;cv.style.height=h+'px';cv.parentNode.style.height=h+'px';const x=cv.getContext('2d');x.scale(d,d);
const X=l=>(l+180)/360*w,Y=l=>(90-l)/180*h;x.fillStyle='#0e1530';x.fillRect(0,0,w,h);x.strokeStyle='#25305a55';x.lineWidth=1;
for(let l=-180;l<=180;l+=30){x.beginPath();x.moveTo(X(l),0);x.lineTo(X(l),h);x.stroke()}for(let l=-90;l<=90;l+=30){x.beginPath();x.moveTo(0,Y(l));x.lineTo(w,Y(l));x.stroke()}
if(land){x.fillStyle='#1d2a55';x.strokeStyle='#33437a';land.forEach(r=>{x.beginPath();r.forEach((p,i)=>i?x.lineTo(X(p[0]),Y(p[1])):x.moveTo(X(p[0]),Y(p[1])));x.closePath();x.fill();x.stroke()})}
MP=S.map((s,i)=>({x:X(s.lon),y:Y(s.lat),r:7+Math.log10(s.occ)*4,c:col(i),i}));
MP.forEach(p=>{x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fillStyle=p.c+'aa';x.fill();x.strokeStyle='#fff';x.lineWidth=1.5;x.stroke();
x.fillStyle='#e9edf8';x.font='12px system-ui';x.fillText(sh(S[p.i]),p.x+p.r+4,p.y+4)})}
$('pgs').addEventListener('mousemove',e=>{const cv=$('map'),t=$('tip');if(!cv||e.target!==cv){t.style.display='none';return}
const b=cv.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top,p=MP.find(p=>(p.x-mx)**2+(p.y-my)**2<(p.r+4)**2);
if(!p){t.style.display='none';return}const s=S[p.i];t.innerHTML=`<b>${sh(s)}</b><br>${s.can}<br>GBIF mean (${s.lat.toFixed(1)}°, ${s.lon.toFixed(1)}°)<br>${fmt(s.occ)} occurrences · top country ${s.cty}`;
t.style.display='block';t.style.left=e.clientX+12+'px';t.style.top=e.clientY+12+'px'});
/* ---- pages ---- */
const P={
ov:{n:'Overview',h:()=>`<div class="k">${kpi('Images',fmt(sum(S,s=>s.n)))}${kpi('Species',S.length)}${kpi('Train / test',Math.round(sum(S,s=>s.train)/sum(S,s=>s.n)*100)+' / '+Math.round(sum(S,s=>s.test)/sum(S,s=>s.n)*100)+' %')}${kpi('GBIF occurrences',fmt(sum(S,s=>s.occ)))}${kpi('Fully fused rows',fmt(Q.ok))}</div>
<div class="g">${card('a1','Image share by species (doughnut)')}${card('a2','Train vs test split (stacked bar)')}${card('a3','GBIF occurrences, log scale (polar area)')}${card('a4','Data-quality checks (bar)')}
<div class="c w2"><h3>Quick insights</h3><ul id="ins"></ul></div></div>`,
r(){const L=S.map(sh);
mk('a1','doughnut',{labels:L,datasets:[{data:S.map(s=>s.n),backgroundColor:S.map((s,i)=>col(i)),borderColor:'#131b33'}]},{cutout:'60%',plugins:{legend:{position:'right'}}});
mk('a2','bar',{labels:L,datasets:[{label:'Train',data:S.map(s=>s.train),backgroundColor:'#ff7a45'},{label:'Test',data:S.map(s=>s.test),backgroundColor:'#b05cff'}]},{indexAxis:'y',scales:{x:{stacked:true},y:{stacked:true}}});
mk('a3','polarArea',{labels:L,datasets:[{data:S.map(s=>Math.log10(s.occ)),backgroundColor:S.map((s,i)=>col(i)+'cc')}]},{plugins:{legend:{position:'right'},tooltip:{callbacks:{label:c=>fmt(S[c.dataIndex].occ)+' records'}}},scales:{r:{ticks:{display:false}}}});
mk('a4','bar',{labels:['GBIF matched','USDA verified','Weather fetched','Fully fused','Weather "Unknown"'],datasets:[{data:[Q.gbif,Q.usda,Q.wx,Q.ok,Q.unk],backgroundColor:['#34d399','#34d399','#34d399','#38bdf8','#fbbf24']}]},{plugins:{legend:{display:false}},scales:{y:{max:Q.total}}});
const b=(f,m)=>S.reduce((a,s)=>(m*f(s)>m*f(a)?s:a)),big=b(s=>s.n,1),sm=b(s=>s.n,-1);
$('ins').innerHTML=`<li><b>${sh(big)}</b> is the largest class (${fmt(big.n)} images) – ${(big.n/sm.n).toFixed(1)}× the smallest, <b>${sh(sm)}</b>. Consider class weights when training.</li>
<li>Highest protein: <b>${sh(b(s=>s.pro,1))}</b> (${b(s=>s.pro,1).pro} g). Highest fat: <b>${sh(b(s=>s.fat,1))}</b> (${b(s=>s.fat,1).fat} g).</li>
<li>Most-recorded in GBIF: <b>${sh(b(s=>s.occ,1))}</b> (${fmt(b(s=>s.occ,1).occ)} records); least: <b>${sh(b(s=>s.occ,-1))}</b> (${fmt(b(s=>s.occ,-1).occ)}).</li>
<li>All ${fmt(Q.total)} rows were matched in all 3 sources, but ${fmt(Q.unk)} rows have no named weather location.</li>`}},
sp:{n:'Spatial',h:()=>`<div class="g"><div class="c w2"><h3>GBIF mean occurrence location (world map · bubble = records)</h3><div class="h"><canvas id="map"></canvas></div></div>
${card('b1','Longitude × latitude (bubble)')}${card('b2','Occurrence records, log scale (bar)')}
<div class="c w2"><h3>Species geography</h3><div class="tw"><table><tr><th>Species</th><th>Accepted name</th><th>Top country</th><th>Countries</th><th>Mean lat</th><th>Mean lon</th><th>Weather location</th></tr>${S.map((s,i)=>`<tr><td><span class="dot" style="background:${PAL[i]}"></span>${sh(s)}</td><td><i>${s.can}</i></td><td>${s.cty}</td><td>${s.countries}</td><td>${s.lat.toFixed(2)}</td><td>${s.lon.toFixed(2)}</td><td>${s.loc}</td></tr>`).join('')}</table></div>
<p class="n">The mean lat/lon is an average of up to 100 georeferenced GBIF records, so it can fall in an ocean or between ranges for widely distributed species.</p></div></div>`,
r(){drawMap();
mk('b1','bubble',{datasets:S.map((s,i)=>({label:sh(s),data:[{x:s.lon,y:s.lat,r:5+Math.log10(s.occ)*3.5}],backgroundColor:col(i)+'bb',borderColor:col(i)}))},{scales:{x:ax('Longitude',{min:-180,max:180}),y:ax('Latitude',{min:-90,max:90})}});
mk('b2','bar',{labels:S.map(sh),datasets:[{data:S.map(s=>s.occ),backgroundColor:S.map((s,i)=>col(i))}]},{plugins:{legend:{display:false}},scales:{y:{type:'logarithmic'}}})}},
nu:{n:'Nutrition',h:()=>`<div class="g">${card('c1','Nutrient profile, % of max (radar)')}${card('c2','Protein / fat / carbs per 100 g (grouped bar)')}${card('c3','Protein vs fat · bubble = calories (scatter)')}${card('c4','Macro composition share (100% stacked)')}
<div class="c w2"><h3>Nutrition heat-table (per 100 g)</h3><div class="tw" id="ht"></div></div></div>`,
r(){const L=S.map(sh),K=[['cal','Calories'],['pro','Protein'],['fat','Fat'],['car','Carbs']],mx=Object.fromEntries(K.map(([k])=>[k,Math.max(...S.map(s=>s[k]))]));
mk('c1','radar',{labels:K.map(k=>k[1]),datasets:S.map((s,i)=>({label:L[i],data:K.map(([k])=>s[k]/mx[k]*100),borderColor:col(i),backgroundColor:col(i)+(foc==i?'55':'11'),pointRadius:2}))},{scales:{r:{ticks:{display:false},grid:{color:'#25305a'},angleLines:{color:'#25305a'}}}});
mk('c2','bar',{labels:L,datasets:[['pro','Protein','#34d399'],['fat','Fat','#fbbf24'],['car','Carbs','#38bdf8']].map(([k,n,c])=>({label:n,data:S.map(s=>s[k]),backgroundColor:c}))},{scales:{y:ax('g / 100 g')}});
mk('c3','bubble',{datasets:S.map((s,i)=>({label:L[i],data:[{x:s.pro,y:s.fat,r:s.cal/14}],backgroundColor:col(i)+'bb',borderColor:col(i)}))},{scales:{x:ax('Protein (g)'),y:ax('Fat (g)')}});
mk('c4','bar',{labels:L,datasets:[['pro','Protein','#34d399'],['fat','Fat','#fbbf24'],['car','Carbs','#38bdf8']].map(([k,n,c])=>({label:n,data:S.map(s=>s[k]/(s.pro+s.fat+s.car)*100),backgroundColor:c}))},{indexAxis:'y',scales:{x:{stacked:true,max:100,title:{display:true,text:'%'}},y:{stacked:true}}});
$('ht').innerHTML='<table><tr><th>Species</th><th>USDA match</th>'+K.map(k=>`<th>${k[1]}</th>`).join('')+'</tr>'+S.map(s=>`<tr><td>${sh(s)}</td><td>${s.fdesc}</td>`+K.map(([k])=>`<td style="background:rgba(176,92,255,${(s[k]/mx[k]*.65).toFixed(2)})">${s[k]}</td>`).join('')+'</tr>').join('')+'</table>'}},
cl:{n:'Climate',h:()=>`<div class="g">${card('d1','Weather profile, min-max scaled (parallel lines)')}${card('d2','Temperature × humidity · bubble = wind (scatter)')}${card('d3','Temperature & humidity (combo bar + line)')}${card('d4','Sky condition by images (doughnut)')}
<div class="c w2"><p class="n" style="margin:0">Weather is a single live snapshot for the nearest named place to each species' mean GBIF location, so it describes where the species is recorded, not when each image was taken. Two species have no named place ("Unknown").</p></div></div>`,
r(){const L=S.map(sh),V=[['temp','Temp °C'],['hum','Humidity %'],['prs','Pressure hPa'],['wnd','Wind m/s'],['cld','Clouds %']],mn=k=>Math.min(...S.map(s=>s[k])),mx=k=>Math.max(...S.map(s=>s[k]));
mk('d1','line',{labels:V.map(v=>v[1]),datasets:S.map((s,i)=>({label:L[i],data:V.map(([k])=>(s[k]-mn(k))/((mx(k)-mn(k))||1)),borderColor:col(i),backgroundColor:col(i),tension:.25,borderWidth:foc==i?4:2}))},{scales:{y:ax('scaled 0–1')}});
mk('d2','bubble',{datasets:S.map((s,i)=>({label:L[i],data:[{x:s.temp,y:s.hum,r:s.wnd*3}],backgroundColor:col(i)+'bb',borderColor:col(i)}))},{scales:{x:ax('Temperature °C'),y:ax('Humidity %')}});
mk('d3','bar',{labels:L,datasets:[{type:'bar',label:'Temp °C',data:S.map(s=>s.temp),backgroundColor:S.map((s,i)=>col(i)),yAxisID:'y'},{type:'line',label:'Humidity %',data:S.map(s=>s.hum),borderColor:'#e9edf8',backgroundColor:'#e9edf8',yAxisID:'y1'}]},{scales:{y:ax('°C'),y1:ax('%',{position:'right',grid:{drawOnChartArea:false}})}});
const wd={};S.forEach(s=>wd[s.wdesc]=(wd[s.wdesc]||0)+s.n);
mk('d4','doughnut',{labels:Object.keys(wd),datasets:[{data:Object.values(wd),backgroundColor:PAL,borderColor:'#131b33'}]},{cutout:'55%',plugins:{legend:{position:'right'}}})}},
ex:{n:'Species explorer',h:()=>`<div class="g"><div class="c"><h3>Select a species</h3><table id="tb"></table></div><div class="c" id="det"></div></div>`,
r(){$('tb').innerHTML='<tr><th>Species</th><th>Images</th><th>Calories</th></tr>'+S.map((s,i)=>`<tr class="r ${foc==i?'sel':''}" data-i="${i}"><td><span class="dot" style="background:${PAL[i]}"></span>${sh(s)}</td><td>${fmt(s.n)}</td><td>${s.cal}</td></tr>`).join('');
document.querySelectorAll('tr.r').forEach(r=>r.onclick=()=>setFoc(+r.dataset.i));
const i=foc<0?0:foc,s=S[i];$('det').innerHTML=`<h3>${s.name}</h3><ul><li><b>Accepted name:</b> <i>${s.can}</i> (GBIF key ${s.tk})</li><li><b>Images:</b> ${fmt(s.n)} (${s.train} train / ${s.test} test)</li><li><b>Range:</b> ${s.countries} countries, top ${s.cty}, mean ${s.lat.toFixed(1)}°, ${s.lon.toFixed(1)}°</li><li><b>USDA:</b> ${s.fdesc} – ${s.cal} kcal, ${s.pro} g protein, ${s.fat} g fat, ${s.car} g carbs</li><li><b>Weather:</b> ${s.loc}, ${s.temp} °C, ${s.hum}% humidity, ${s.wdesc}</li></ul><div class="h" style="height:200px;margin-top:10px"><canvas id="e1"></canvas></div>`;
const K=['cal','pro','fat','car'],avg=K.map(k=>sum(S,x=>x[k])/S.length);
mk('e1','bar',{labels:['Calories','Protein','Fat','Carbs'],datasets:[{label:sh(s),data:K.map(k=>s[k]),backgroundColor:PAL[i]},{label:'Species average',data:avg,backgroundColor:'#93a0c455'}]})}}};
$('nav').innerHTML=Object.entries(P).map(([k,v])=>`<button data-k="${k}">${v.n}</button>`).join('');
$('pgs').innerHTML=Object.entries(P).map(([k,v])=>`<section class="pg" id="p_${k}">${v.h()}</section>`).join('');
$('foc').innerHTML='<option value="-1">All species</option>'+S.map((s,i)=>`<option value="${i}">${sh(s)}</option>`).join('');
function show(k){page=k;document.querySelectorAll('.pg').forEach(p=>p.classList.toggle('on',p.id=='p_'+k));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));P[k].r()}
function setFoc(i){foc=i;$('foc').value=i;show(page)}
$('foc').onchange=e=>setFoc(+e.target.value);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.k));
addEventListener('resize',()=>page=='sp'&&drawMap());show('ov');
</script></body></html>
